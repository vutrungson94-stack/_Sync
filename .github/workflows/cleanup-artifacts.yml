name: Cleanup old artifacts

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    name: Delete artifacts older than 3 days
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 3);
            const protectedPattern = /(signed|release)/i;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            for (const artifact of artifacts) {
              if (protectedPattern.test(artifact.name)) {
                core.info(`Skipping protected artifact ${artifact.name} (${artifact.id})`);
                continue;
              }
              if (new Date(artifact.created_at) >= cutoff) continue;
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
              core.info(`Deleted artifact ${artifact.name} (${artifact.id})`);
            }