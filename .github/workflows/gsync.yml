name: _Sync CI

on:
  push:
    branches: [ main, master ]
    paths:
      - '**'
      - '.github/workflows/gsync.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**'
      - '.github/workflows/gsync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pester batch (fail-closed)
    # Pinned image: ubuntu-latest migrates to Ubuntu 26 (starts 2026-10-19).
    # ubuntu-24.04 is a GitHub-hosted image with pwsh preinstalled, no setup action needed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Pester batch
        shell: pwsh
        run: |
          # Run-Tests.ps1 reports the verdict through its EXIT CODE. A
          # try/catch only catches terminating errors, so the code was never
          # inspected and a failing suite still passed the job.
          & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./Run-Tests.ps1 -OutputPath ./TestResults
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Error "_Sync test suite failed (exit code $code)"
            exit $code
          }

      - name: Self-test gates
        shell: pwsh
        run: |
          & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./gsync.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: gsync-testresults
          path: TestResults/**
          retention-days: 3
          compression-level: 9
          if-no-files-found: ignore

  ps51-smoke:
    name: Windows PowerShell 5.1 smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          & powershell -NoProfile -ExecutionPolicy Bypass -File ./gsync.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit 1 }

  sbom:
    name: SBOM + provenance (CycloneDX)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate SBOM and check the policy gate
        shell: pwsh
        run: |
          Import-Module ./Modules/SupplyChain.psm1 -Force -Global -DisableNameChecking
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          # New-SyncSbom returns the document; Write-SyncSbom writes it to the
          # report directory and returns the FILE PATH the gate expects.
          $sbomPath = Write-SyncSbom -Root $root -ToolName 'gsync'
          Write-Host "SBOM written to $sbomPath"
          $gate = Invoke-SyncSbomPolicyGate -SbomPath $sbomPath -Root $root
          if (-not $gate.Passed) {
            $gate.Violations | ForEach-Object { Write-Error "$($_.Component)@$($_.Version) denied by $($_.Rule)" }
            exit 1
          }

      - name: Upload SBOM
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: gsync-sbom
          path: build-reports/**
          retention-days: 7
          compression-level: 9
          if-no-files-found: ignore

  coverage:
    name: Code coverage
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run the suite with code coverage
        shell: pwsh
        run: |
          $root = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).FullName
          Import-Module Pester -Force
          $config = [PesterConfiguration]::Default
          $config.Run.Path = (Join-Path $root 'Tests')
          $config.Run.Exit = $true
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.OutputPath = (Join-Path $root 'coverage.xml')
          $config.CodeCoverage.CoveragePercentTarget = 35
          $config.CodeCoverage.Path = @((Join-Path $root 'Modules'), (Join-Path $root 'Core'))
          $config.CodeCoverage.RecursePaths = $true
          Invoke-Pester -Configuration $config

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: gsync-coverage
          path: coverage.xml
          retention-days: 3
          compression-level: 9
          if-no-files-found: ignore

  otel:
    name: OTLP telemetry export
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Export metrics over OTLP
        shell: pwsh
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
        run: |
          if (-not $env:OTEL_EXPORTER_OTLP_ENDPOINT) {
            Write-Host 'OTLP endpoint not configured; skipping export.'
            exit 0
          }
          Import-Module ./Modules/Metrics.psm1 -Force -Global -DisableNameChecking
          New-SyncMetricCounter -Name 'gsync_ci_run_total' -Help 'CI run counter'
          Add-SyncMetric -Name 'gsync_ci_run_total' -Value 1
          $ok = Push-MetricsOtlp -ServiceName 'gsync-ci'
          if (-not $ok) { Write-Error 'OTLP export failed'; exit 1 }
